name: release

# Tag push = release: verify, OIDC-publish, GitHub release with tarballs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except `npm publish` (recommended first)'
        type: boolean
        default: true
      run_tests:
        description: 'Run the test suite before publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test suite
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: npm test

      - name: Discoverability audit (offline, read-only)
        run: node packages/rdk-cli/bin/rdk.js audit

      - name: Show what would be published
        run: |
          npm run npm-surface
          echo "--- rdk-cli tarball:"
          npm pack --dry-run --workspace packages/rdk-cli
          echo "--- repo-aeo-mcp tarball:"
          npm pack --dry-run --workspace packages/repo-aeo-mcp

  publish:
    name: Publish to npm
    needs: verify
    # OIDC trusted publishing is bound to this environment; no long-lived secrets.
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Exchange OIDC token for registry token (engine)
        working-directory: packages/rdk-cli
        run: |
          name=$(node -p "require('./package.json').name")
          id_token=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          if [ "$http_code" = "201" ]; then
            token=$(echo "$body" | jq -r '.token')
            echo "NODE_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
            echo "OIDC exchange succeeded for $name"
          else
            echo "OIDC exchange failed for $name: HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Publish the engine first
        working-directory: packages/rdk-cli
        run: |
          name=$(node -p "require('./package.json').name")
          local=$(node -p "require('./package.json').version")
          published=$(npm view "$name" version 2>/dev/null || echo none)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public
          elif [ "$local" = "$published" ]; then
            echo "$name@$local is already in the registry; skipping"
          else
            npm publish --access public
          fi

      # repo-aeo-mcp declares a dependency on the published version of the
      # engine, so it must go second: a consumer installing it immediately
      # resolves a real repo-aeo tarball.
      - name: Exchange OIDC token for registry token (mcp)
        working-directory: packages/repo-aeo-mcp
        run: |
          name=$(node -p "require('./package.json').name")
          id_token=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          if [ "$http_code" = "201" ]; then
            token=$(echo "$body" | jq -r '.token')
            echo "NODE_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
            echo "OIDC exchange succeeded for $name"
          else
            echo "OIDC exchange failed for $name: HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Publish the MCP server
        working-directory: packages/repo-aeo-mcp
        run: |
          name=$(node -p "require('./package.json').name")
          local=$(node -p "require('./package.json').version")
          published=$(npm view "$name" version 2>/dev/null || echo none)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public
          elif [ "$local" = "$published" ]; then
            echo "$name@$local is already in the registry; skipping"
          else
            npm publish --access public
          fi

      - name: Pack the published tarballs
        run: |
          npm pack --workspace packages/rdk-cli --pack-destination .
          npm pack --workspace packages/repo-aeo-mcp --pack-destination .

      - name: Create the GitHub release with the tarballs
        if: github.event_name == 'push'
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release for $tag already exists; skipping"
            exit 0
          fi
          if git tag -l --format='%(contents)' "$tag" | grep -q .; then
            gh release create "$tag" --verify-tag --notes-from-tag repo-aeo-*.tgz repo-aeo-mcp-*.tgz
          else
            gh release create "$tag" --verify-tag --generate-notes repo-aeo-*.tgz repo-aeo-mcp-*.tgz
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### npm publish (${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true && 'dry run' || 'live') || 'tag release' }})";
            echo "";
            echo "| Package | Version |";
            echo "| --- | --- |";
            node -e "for (const p of ['packages/rdk-cli','packages/repo-aeo-mcp']) { const j = require('./' + p + '/package.json'); console.log('| ' + j.name + ' | ' + j.version + ' |'); }";
            echo "";
            echo "GitHub description/homepage/topics are **not** touched by this workflow.";
            echo "Run \`rdk github-sync --apply --ack I_ACK_RDK_GITHUB_WRITE --reason \"<why>\"\` separately.";
          } >> "$GITHUB_STEP_SUMMARY"
