<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent terminal — before / after template (v2)</title>
<style>
  :root {
    --page:          #000000;
    --bg:            #0d0d0d;
    --panel:         #1a1a1a;
    --border:        #2a2a2a;
    --border-subtle: #1e1e1e;
    --text:          #d0d0d0;
    --muted:         #888888;
    --accent:        #3b82f6;
    --green:         #4ade80;
    --red:           #e06c75;
    --yellow:        #f5a742;
    --diff-added:    #7ee787;
    --diff-added-bg: #10231a;
    --diff-del:      #ff8f8f;
    --diff-del-bg:   #2c1618;
    --tool-glyph:    var(--muted);
    --titlebar:      #161616;

    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono", "JetBrains Mono",
            Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }

  /* ---------- theme: claude-code (warm / coral) ---------- */
  body[data-theme="claude-code"] {
    --page:          #0a0807;
    --bg:            #17120f;
    --panel:         #241c17;
    --border:        #3b2f27;
    --border-subtle: #2b221c;
    --text:          #ece3da;
    --muted:         #a2938a;
    --accent:        #d97757;
    --green:         #8fce9f;
    --red:           #e08a7a;
    --yellow:        #e0b070;
    --diff-added:    #a8d8a0;
    --diff-added-bg: #1c2a1c;
    --diff-del:      #e8a08f;
    --diff-del-bg:   #2e1c18;
    --tool-glyph:    var(--accent);
    --titlebar:      #1d1713;
  }

  /* ---------- theme: codex (minimal / green) ---------- */
  body[data-theme="codex"] {
    --page:          #000000;
    --bg:            #0b0f0e;
    --panel:         #141a18;
    --border:        #223029;
    --border-subtle: #182420;
    --text:          #d6e0dc;
    --muted:         #7f8f89;
    --accent:        #10a37f;
    --green:         #4ade80;
    --red:           #e06c75;
    --yellow:        #f5a742;
    --diff-added:    #7ee787;
    --diff-added-bg: #0f231c;
    --diff-del:      #ff8f8f;
    --diff-del-bg:   #2c1618;
    --tool-glyph:    var(--muted);
    --titlebar:      #101614;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    padding: 22px 18px;
  }

  /* ---------- comparison scaffold ---------- */
  .compare {
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1 1 0;
    min-width: 0;
  }

  .panel-caption {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .panel-caption::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 auto;
  }
  .panel[data-panel="before"] .panel-caption { color: var(--red); }
  .panel[data-panel="after"]  .panel-caption { color: var(--green); }

  /* ---------- terminal window (hugs its content) ---------- */
  .window {
    flex: 0 0 auto;
    height: fit-content;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
  }

  .titlebar {
    height: 40px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--titlebar);
    border-bottom: 1px solid var(--border-subtle);
  }
  .dots { display: flex; gap: 8px; flex: 0 0 auto; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red    { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green  { background: #27c93f; }

  .window-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .win-icon {
    width: 13px; height: 13px;
    border-radius: 3px;
    background: var(--accent);
    flex: 0 0 auto;
  }
  .win-prefix { color: var(--accent); font-weight: 600; flex: 0 0 auto; }
  .win-sep { color: var(--muted); flex: 0 0 auto; }
  .win-title-text { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- session body ---------- */
  .body {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 16px 10px;
  }

  .messages {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .header-panel {
    background: var(--panel);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .session-title {
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .usage {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    flex: 0 0 auto;
  }

  /* ---------- event blocks ---------- */
  .user-msg {
    background: var(--panel);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    line-height: 1.45;
  }

  .prose-line {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
  }

  .tool-line {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    padding-left: 14px;
  }
  .tool-glyph { color: var(--tool-glyph); flex: 0 0 auto; min-width: 14px; }
  .tool-text { white-space: pre-wrap; min-width: 0; }

  body[data-theme="claude-code"] .tool-line {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
  }

  /* ---------- diff block ---------- */
  .diff {
    border-radius: 5px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-left: 2px solid var(--border);
  }
  .diff-line {
    font-size: 12px;
    line-height: 1.34;
    padding: 1px 10px 1px 8px;
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .diff-line.add { background: var(--diff-added-bg); color: var(--diff-added); }
  .diff-line.add::before { content: "+ "; }
  .diff-line.del { background: var(--diff-del-bg); color: var(--diff-del); }
  .diff-line.del::before { content: "- "; }
  .diff-line.ctx { background: var(--panel); color: var(--muted); }
  .diff-line.ctx::before { content: "  "; }

  .status {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }
  .status-glyph { color: var(--muted); flex: 0 0 auto; min-width: 14px; }
  .status-text { white-space: pre-wrap; }

  .done {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: var(--green);
    line-height: 1.4;
  }
  .done-glyph { color: var(--green); flex: 0 0 auto; min-width: 14px; }
  .done-text { white-space: pre-wrap; }

  /* ---------- inline markdown ---------- */
  code {
    font-family: var(--mono);
    font-size: 0.92em;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 0 4px;
    color: var(--text);
  }
  strong { color: var(--text); font-weight: 700; }

  /* ---------- agent line ---------- */
  .agent-line {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .agent-glyph { color: var(--accent); font-size: 12px; }
  .agent-line .agent-name { color: var(--accent); }

  /* ---------- input box ---------- */
  .input-box {
    background: var(--panel);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: 12px 14px;
    min-height: 46px;
    display: flex;
    align-items: center;
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 17px;
    background: var(--text);
  }

  .input-meta {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
    padding-left: 3px;
  }
  .input-meta .agent-name { color: var(--accent); }

  /* ---------- status bar ---------- */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
  }
  .status-left-group { display: flex; align-items: center; min-width: 0; flex: 0 0 auto; }
  .status-dots { color: var(--border); letter-spacing: 1px; margin-right: 8px; flex: 0 0 auto; }
  .status-left, .status-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .hk { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .hk kbd {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    line-height: 1.5;
  }
  .hk-label { color: var(--muted); }
  .hk-sep {
    width: 1px;
    height: 12px;
    background: var(--border);
    flex: 0 0 auto;
  }

  /* ---------- arrow column ---------- */
  .arrow-col {
    flex: 0 0 120px;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 0 12px;
  }
  .arrow-badge {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    color: var(--green);
    background: radial-gradient(circle at 50% 38%, rgba(74, 222, 128, 0.18), rgba(74, 222, 128, 0.02) 72%);
    border: 1px solid rgba(74, 222, 128, 0.35);
    box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.06), 0 0 24px rgba(74, 222, 128, 0.18);
  }
  .arrow-badge svg { width: 26px; height: 26px; }
  .arrow-caption {
    font-size: 12px;
    color: var(--green);
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body data-theme="opencode">
  <div class="compare">

    <!-- ============ BEFORE PANEL ============ -->
    <div class="panel" data-panel="before">
      <div class="panel-caption" data-slot="caption">without plugin</div>
      <div class="window">
        <div class="titlebar">
          <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
          <div class="window-title">
            <span class="win-icon"></span>
            <span class="win-prefix">OC</span>
            <span class="win-sep">|</span>
            <span class="win-title-text" data-slot="windowTitle">session</span>
          </div>
        </div>
        <div class="body">
          <div class="messages">
            <div class="header-panel">
              <div class="session-title" data-slot="sessionTitle"># session</div>
              <div class="usage" data-slot="usage">0  0%  ($0.00)</div>
            </div>
            <div data-blocks></div>
            <div class="agent-line">
              <span class="agent-glyph">▣</span>
              <span class="agent-name" data-slot="agentName">Build</span>
              <span class="agent-model" data-slot="agentModel">· claude-opus-4-5</span>
            </div>
          </div>
          <div class="input-box"><span class="cursor"></span></div>
          <div class="input-meta">
            <span class="agent-name" data-slot="inputAgent">Build</span>
            <span data-slot="inputModel">Claude Opus 4.5</span>
            <span data-slot="inputProvider">OpenCode Zen</span>
          </div>
          <div class="statusbar">
            <span class="status-left-group">
              <span class="status-dots" aria-hidden="true">······</span>
              <span class="status-left"></span>
            </span>
            <span class="status-right"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ ARROW ============ -->
    <div class="arrow-col">
      <div class="arrow-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h15" />
          <path d="M13 6l6 6-6 6" />
        </svg>
      </div>
      <div class="arrow-caption" data-slot="arrowCaption">plugin</div>
    </div>

    <!-- ============ AFTER PANEL ============ -->
    <div class="panel" data-panel="after">
      <div class="panel-caption" data-slot="caption">with plugin</div>
      <div class="window">
        <div class="titlebar">
          <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
          <div class="window-title">
            <span class="win-icon"></span>
            <span class="win-prefix">OC</span>
            <span class="win-sep">|</span>
            <span class="win-title-text" data-slot="windowTitle">session</span>
          </div>
        </div>
        <div class="body">
          <div class="messages">
            <div class="header-panel">
              <div class="session-title" data-slot="sessionTitle"># session</div>
              <div class="usage" data-slot="usage">0  0%  ($0.00)</div>
            </div>
            <div data-blocks></div>
            <div class="agent-line">
              <span class="agent-glyph">▣</span>
              <span class="agent-name" data-slot="agentName">Build</span>
              <span class="agent-model" data-slot="agentModel">· claude-opus-4-5</span>
            </div>
          </div>
          <div class="input-box"><span class="cursor"></span></div>
          <div class="input-meta">
            <span class="agent-name" data-slot="inputAgent">Build</span>
            <span data-slot="inputModel">Claude Opus 4.5</span>
            <span data-slot="inputProvider">OpenCode Zen</span>
          </div>
          <div class="statusbar">
            <span class="status-left-group">
              <span class="status-dots" aria-hidden="true">······</span>
              <span class="status-left"></span>
            </span>
            <span class="status-right"></span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    var THEMES = {
      opencode: {
        prefix: "OC",
        agentGlyph: "\u25A3",
        dots: true,
        glyphs: { call: "*", read: "->", write: "*", search: "*", status: "~", done: "\u2713" },
        defaultStatusLeft: "esc interrupt",
        defaultStatusRight: "ctrl+t variants  tab agents  ctrl+p commands"
      },
      "claude-code": {
        prefix: "claude",
        agentGlyph: "\u23FA",
        dots: false,
        glyphs: { call: "\u23FA", read: "\u23FA", write: "\u23FA", search: "\u23FA", status: "\u273B", done: "\u2714" },
        defaultStatusLeft: "esc to interrupt",
        defaultStatusRight: "? for shortcuts"
      },
      codex: {
        prefix: "codex",
        agentGlyph: "\u258C",
        dots: false,
        glyphs: { call: "\u2022", read: "\u203A", write: "\u2022", search: "\u2022", status: "\u2026", done: "\u2713" },
        defaultStatusLeft: "esc to interrupt",
        defaultStatusRight: "ctrl+c quit  / commands"
      }
    };

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function md(s) {
      var out = esc(s);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return out;
    }

    function hotkeys(str) {
      if (!str) return "";
      return String(str).split(/\s{2,}/).map(function (group) {
        var m = group.match(/^(\S+)\s*(.*)$/);
        if (!m) return "";
        var key = m[1];
        var label = m[2] || "";
        return '<span class="hk"><kbd>' + esc(key) + "</kbd>" +
          (label ? '<span class="hk-label">' + esc(label) + "</span>" : "") + "</span>";
      }).join('<span class="hk-sep"></span>');
    }

    function renderBlock(b, T) {
      var el;
      if (b.type === "user") {
        el = document.createElement("div");
        el.className = "user-msg";
        el.innerHTML = md(b.text);
      } else if (b.type === "prose") {
        el = document.createElement("p");
        el.className = "prose-line";
        el.innerHTML = md(b.text);
      } else if (b.type === "tool") {
        var kind = b.kind || "call";
        var glyph = (T.glyphs && T.glyphs[kind]) || T.glyphs.call;
        el = document.createElement("div");
        el.className = "tool-line tool-" + kind;
        el.innerHTML = '<span class="tool-glyph">' + esc(glyph) + '</span>' +
          '<span class="tool-text">' + md(b.text) + "</span>";
      } else if (b.type === "diff") {
        el = document.createElement("div");
        el.className = "diff";
        (b.lines || []).forEach(function (l) {
          var d = document.createElement("div");
          d.className = "diff-line " + (l.type || "ctx");
          d.innerHTML = md(l.text);
          el.appendChild(d);
        });
      } else if (b.type === "status") {
        el = document.createElement("div");
        el.className = "status";
        el.innerHTML = '<span class="status-glyph">' + esc(T.glyphs.status) + '</span>' +
          '<span class="status-text">' + md(b.text) + "</span>";
      } else if (b.type === "done") {
        el = document.createElement("div");
        el.className = "done";
        el.innerHTML = '<span class="done-glyph">' + esc(T.glyphs.done) + '</span>' +
          '<span class="done-text">' + md(b.text) + "</span>";
      } else {
        el = document.createElement("p");
        el.className = "prose-line";
        el.innerHTML = md(b.text || "");
      }
      return el;
    }

    window.fillTemplate = function (data) {
      var theme = data.theme || "opencode";
      var T = THEMES[theme] || THEMES.opencode;
      document.body.setAttribute("data-theme", theme);

      function resolve(el, key) {
        var panel = el.closest("[data-panel]");
        var pk = panel ? panel.getAttribute("data-panel") : null;
        if (pk && data[pk] && key in data[pk]) return data[pk][key];
        if (key in data) return data[key];
        return undefined;
      }

      document.querySelectorAll(".win-prefix").forEach(function (el) { el.textContent = T.prefix; });
      document.querySelectorAll(".agent-glyph").forEach(function (el) { el.textContent = T.agentGlyph; });
      document.querySelectorAll(".status-dots").forEach(function (el) {
        el.style.display = T.dots ? "" : "none";
      });

      document.querySelectorAll("[data-slot]").forEach(function (el) {
        var value = resolve(el, el.getAttribute("data-slot"));
        if (value !== undefined && value !== null) el.textContent = value;
      });

      document.querySelectorAll(".status-left").forEach(function (el) {
        el.innerHTML = hotkeys(resolve(el, "statusLeft") || T.defaultStatusLeft);
      });
      document.querySelectorAll(".status-right").forEach(function (el) {
        el.innerHTML = hotkeys(resolve(el, "statusRight") || T.defaultStatusRight);
      });

      document.querySelectorAll("[data-blocks]").forEach(function (container) {
        var panel = container.closest("[data-panel]");
        var pk = panel ? panel.getAttribute("data-panel") : null;
        var blocks = (pk && data[pk] && data[pk].blocks) || [];
        container.innerHTML = "";
        blocks.forEach(function (b) { container.appendChild(renderBlock(b, T)); });
      });
    };
  </script>
</body>
</html>
