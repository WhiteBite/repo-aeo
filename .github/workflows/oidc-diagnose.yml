name: oidc-diagnose

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: npm version
        run: npm --version

      - name: OIDC environment detection
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          echo "NODE_AUTH_TOKEN prefix: ${NODE_AUTH_TOKEN:0:6}"

      - name: Fetch and decode OIDC token claims
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "FAILED to get ID token"
            exit 1
          fi
          echo "$ID_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref, workflow, environment, event, job_workflow_ref, actor}' || echo "$ID_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null

      - name: Attempt manual OIDC exchange for repo-aeo
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          echo "Exchange response:"
          curl -s -w "\nHTTP status: %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/repo-aeo"

      - name: Check .npmrc content
        run: cat .npmrc 2>/dev/null || echo "no .npmrc in project dir"
