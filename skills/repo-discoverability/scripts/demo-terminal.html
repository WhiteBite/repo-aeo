<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent terminal — before / after template (v4)</title>
<style>
  :root {
    --page:          #000000;
    --bg:            #0d0d0d;
    --panel:         #1a1a1a;
    --border:        #2a2a2a;
    --border-subtle: #1e1e1e;
    --text:          #d0d0d0;
    --muted:         #8a8a8a;
    --accent:        #3b82f6;
    --green:         #4ade80;
    --red:           #e06c75;
    --yellow:        #f5a742;
    --diff-added:    #7ee787;
    --diff-added-bg: #10231a;
    --diff-del:      #ff8f8f;
    --diff-del-bg:   #2c1618;
    --tool-glyph:    var(--muted);
    --titlebar:      #161616;

    --diff-del-border:   rgba(224, 108, 117, 0.28);
    --diff-added-border: rgba(74, 222, 128, 0.28);
    --code-bg:           rgba(255, 255, 255, 0.07);
    --arrow-bg:          radial-gradient(circle at 50% 38%, rgba(74, 222, 128, 0.18), rgba(74, 222, 128, 0.02) 72%);
    --arrow-border:      rgba(74, 222, 128, 0.35);
    --arrow-shadow:      0 0 0 1px rgba(74, 222, 128, 0.06), 0 0 24px rgba(74, 222, 128, 0.18);
    --takeaway-bg:       rgba(74, 222, 128, 0.09);
    --takeaway-border:   rgba(74, 222, 128, 0.28);
    --window-shadow:     0 18px 50px rgba(0, 0, 0, 0.6);
    --anno-green-ink:    #06210f;

    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono", "JetBrains Mono",
            Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }

  /* ---------- theme: claude-code (warm / coral) ---------- */
  body[data-theme="claude-code"] {
    --page:          #0a0807;
    --bg:            #17120f;
    --panel:         #241c17;
    --border:        #3b2f27;
    --border-subtle: #2b221c;
    --text:          #ece3da;
    --muted:         #a2938a;
    --accent:        #d97757;
    --green:         #8fce9f;
    --red:           #e08a7a;
    --yellow:        #e0b070;
    --diff-added:    #a8d8a0;
    --diff-added-bg: #1c2a1c;
    --diff-del:      #e8a08f;
    --diff-del-bg:   #2e1c18;
    --tool-glyph:    var(--accent);
    --titlebar:      #1d1713;
  }

  /* ---------- theme: codex (minimal / green) ---------- */
  body[data-theme="codex"] {
    --page:          #000000;
    --bg:            #0b0f0e;
    --panel:         #141a18;
    --border:        #223029;
    --border-subtle: #182420;
    --text:          #d6e0dc;
    --muted:         #7f8f89;
    --accent:        #10a37f;
    --green:         #4ade80;
    --red:           #e06c75;
    --yellow:        #f5a742;
    --diff-added:    #7ee787;
    --diff-added-bg: #0f231c;
    --diff-del:      #ff8f8f;
    --diff-del-bg:   #2c1618;
    --tool-glyph:    var(--muted);
    --titlebar:      #101614;
  }

  /* ---------- palette: light (orthogonal to theme; overrides the scheme) ---------- */
  body[data-palette="light"] {
    --page:          #f4f4f2;
    --bg:            #ffffff;
    --panel:         #f1f1ef;
    --border:        #d6d6d3;
    --border-subtle: #e6e6e3;
    --text:          #1b1b1b;
    --muted:         #6a6a6a;
    --green:         #15803d;
    --red:           #b91c1c;
    --yellow:        #b45309;
    --diff-added:    #15803d;
    --diff-added-bg: #e8f6ec;
    --diff-del:      #b91c1c;
    --diff-del-bg:   #fdecec;
    --titlebar:      #ececea;

    --diff-del-border:   rgba(185, 28, 28, 0.32);
    --diff-added-border: rgba(21, 128, 61, 0.32);
    --code-bg:           rgba(0, 0, 0, 0.05);
    --arrow-bg:          radial-gradient(circle at 50% 38%, rgba(21, 128, 61, 0.14), rgba(21, 128, 61, 0.02) 72%);
    --arrow-border:      rgba(21, 128, 61, 0.4);
    --arrow-shadow:      0 0 0 1px rgba(21, 128, 61, 0.08), 0 0 24px rgba(21, 128, 61, 0.14);
    --takeaway-bg:       rgba(21, 128, 61, 0.08);
    --takeaway-border:   rgba(21, 128, 61, 0.3);
    --window-shadow:     0 18px 50px rgba(0, 0, 0, 0.12);
    --anno-green-ink:    #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    padding: 0;
  }

  .stage {
    width: 900px;
    margin: 0 auto;
    padding: 20px 22px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  /* ---------- comparison scaffold ---------- */
  .compare {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 12px;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1 1 0;
    min-width: 0;
  }

  .panel-caption {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .panel-caption::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 auto;
  }
  .panel[data-panel="before"] .panel-caption { color: var(--red); }
  .panel[data-panel="after"]  .panel-caption { color: var(--green); }

  /* ---------- terminal window (stretches to the taller panel) ---------- */
  .window {
    flex: 1 1 auto;
    height: auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--window-shadow);
  }

  .titlebar {
    height: 38px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    background: var(--titlebar);
    border-bottom: 1px solid var(--border-subtle);
  }
  .dots { display: flex; gap: 8px; flex: 0 0 auto; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red    { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green  { background: #27c93f; }

  .window-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .win-icon {
    width: 13px; height: 13px;
    border-radius: 3px;
    background: var(--accent);
    flex: 0 0 auto;
  }
  .win-prefix { color: var(--accent); font-weight: 600; flex: 0 0 auto; }
  .win-sep { color: var(--muted); flex: 0 0 auto; }
  .win-title-text { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- session body ---------- */
  .body {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px;
  }

  .session-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .messages {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  /* ---------- event blocks ---------- */
  .user-msg {
    display: flex;
    gap: 8px;
    background: var(--panel);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }
  .user-glyph { color: var(--accent); font-weight: 700; flex: 0 0 auto; }
  .user-text { min-width: 0; }

  .prose-line {
    font-size: 13px;
    color: var(--text);
    line-height: 1.45;
  }

  .tool-line {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
    padding-left: 2px;
  }
  .tool-glyph { color: var(--tool-glyph); flex: 0 0 auto; min-width: 14px; }
  .tool-text { white-space: pre-wrap; min-width: 0; }

  /* ---------- pain / payoff block ---------- */
  .diff {
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 13px;
  }
  .panel[data-panel="before"] .diff {
    background: var(--diff-del-bg);
    border: 1px solid var(--diff-del-border);
  }
  .panel[data-panel="after"] .diff {
    background: var(--diff-added-bg);
    border: 1px solid var(--diff-added-border);
  }
  .diff-line {
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .diff-line { color: var(--diff-del); }
  .panel[data-panel="after"] .diff-line { color: var(--diff-added); }
  .diff-line.ctx { color: var(--muted); }
  .diff-line.add::before { content: "+ "; }
  .diff-line.del::before { content: "- "; }
  .diff-line.ctx::before { content: "  "; }

  .diff-line.cols {
    display: grid;
    grid-template-columns: minmax(72px, auto) 1fr;
    column-gap: 14px;
    white-space: normal;
    position: relative;
    padding-left: 16px;
  }
  .diff-line.cols::before {
    position: absolute;
    left: 0;
    top: 0;
  }
  .dl-left, .dl-right { white-space: pre-wrap; min-width: 0; }

  /* ---------- file card (files surface) ---------- */
  .file {
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 12px;
  }
  .panel[data-panel="before"] .file {
    background: var(--diff-del-bg);
    border: 1px solid var(--diff-del-border);
  }
  .panel[data-panel="after"] .file {
    background: var(--diff-added-bg);
    border: 1px solid var(--diff-added-border);
  }
  .file-path {
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }
  .status-glyph { color: var(--muted); flex: 0 0 auto; min-width: 14px; }
  .status-text { white-space: pre-wrap; }

  .done {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: var(--green);
    line-height: 1.4;
  }
  .done-glyph { color: var(--green); flex: 0 0 auto; min-width: 14px; }
  .done-text { white-space: pre-wrap; }

  /* ---------- inline markdown ---------- */
  code {
    font-family: var(--mono);
    font-size: 0.92em;
    background: var(--code-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 0 4px;
    color: var(--text);
  }
  strong { color: var(--text); font-weight: 700; }

  /* ---------- input box ---------- */
  .input-box {
    background: var(--panel);
    border-radius: 6px;
    padding: 10px 12px;
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--text);
  }

  .panel[data-surface="files"] .input-box { display: none; }

  /* ---------- shots surface ---------- */
  .panel[data-surface="shots"] .titlebar,
  .panel[data-surface="shots"] .session-title,
  .panel[data-surface="shots"] .input-box { display: none; }
  .panel[data-surface="shots"] .body { padding: 0; }
  .panel[data-surface="shots"] .messages {
    align-items: center;
    justify-content: center;
  }

  .shot-canvas {
    position: relative;
    display: inline-block;
    line-height: 0;
    max-width: 100%;
    overflow: hidden;
  }
  .shot-canvas img {
    display: block;
    width: var(--shot-w, auto);
    height: auto;
    max-width: 100%;
    max-height: 420px;
  }
  .shot-anno {
    position: absolute;
    border: 2px solid var(--red);
    border-radius: 4px;
  }
  .shot-anno.green { border-color: var(--green); }
  .shot-anno.dim { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); }
  .shot-anno-label {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.5;
    padding: 0 6px;
    border-radius: 3px;
    background: var(--red);
    color: #ffffff;
    white-space: nowrap;
  }
  .shot-anno.green .shot-anno-label { background: var(--green); color: var(--anno-green-ink); }
  .shot-caption {
    align-self: stretch;
    width: 100%;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--border-subtle);
    padding: 6px 10px;
  }

  /* ---------- steps block ---------- */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
  }
  .step {
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .step-num {
    flex: 0 0 auto;
    min-width: 16px;
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .step-glyph { flex: 0 0 auto; min-width: 14px; }
  .step-glyph.ok { color: var(--green); }
  .step-glyph.pain { color: var(--red); }
  .step-glyph.removed { color: var(--muted); }
  .step-text { min-width: 0; }
  .step.removed .step-text { color: var(--muted); text-decoration: line-through; }
  .steps-more {
    color: var(--muted);
    font-size: 12px;
    padding-left: 24px;
  }
  .steps-collapse {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: var(--green);
  }
  .steps-collapse-glyph { flex: 0 0 auto; min-width: 14px; }

  /* ---------- arrow column ---------- */
  .arrow-col {
    flex: 0 0 40px;
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arrow-badge {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: var(--green);
    background: var(--arrow-bg);
    border: 1px solid var(--arrow-border);
    box-shadow: var(--arrow-shadow);
  }
  .arrow-badge svg { width: 18px; height: 18px; }

  /* ---------- takeaway banner ---------- */
  .takeaway {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 22px;
    border-radius: 10px;
    background: var(--takeaway-bg);
    border: 1px solid var(--takeaway-border);
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
  }
  .takeaway-glyph { color: var(--green); flex: 0 0 auto; display: flex; }
  .takeaway-glyph svg { width: 18px; height: 18px; }
  .takeaway-text { min-width: 0; }
</style>
</head>
<body data-theme="opencode">
  <div class="stage">
    <div class="compare">

      <!-- ============ BEFORE PANEL ============ -->
      <div class="panel" data-panel="before">
        <div class="panel-caption" data-slot="caption">before</div>
        <div class="window">
          <div class="titlebar">
            <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
            <div class="window-title">
              <span class="win-icon"></span>
              <span class="win-prefix">OC</span>
              <span class="win-sep">|</span>
              <span class="win-title-text" data-slot="windowTitle">session</span>
            </div>
          </div>
          <div class="body">
            <div class="session-title" data-slot="sessionTitle"># session</div>
            <div class="messages" data-blocks></div>
            <div class="input-box"><span class="cursor"></span></div>
          </div>
        </div>
      </div>

      <!-- ============ ARROW ============ -->
      <div class="arrow-col">
        <div class="arrow-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h15" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </div>
      </div>

      <!-- ============ AFTER PANEL ============ -->
      <div class="panel" data-panel="after">
        <div class="panel-caption" data-slot="caption">after</div>
        <div class="window">
          <div class="titlebar">
            <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
            <div class="window-title">
              <span class="win-icon"></span>
              <span class="win-prefix">OC</span>
              <span class="win-sep">|</span>
              <span class="win-title-text" data-slot="windowTitle">session</span>
            </div>
          </div>
          <div class="body">
            <div class="session-title" data-slot="sessionTitle"># session</div>
            <div class="messages" data-blocks></div>
            <div class="input-box"><span class="cursor"></span></div>
          </div>
        </div>
      </div>

    </div>

    <!-- ============ TAKEAWAY ============ -->
    <div class="takeaway">
      <span class="takeaway-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </span>
      <span class="takeaway-text" data-slot="takeaway">takeaway</span>
    </div>
  </div>

  <script>
    var THEMES = {
      opencode: {
        prefix: "OC",
        agentGlyph: "\u25A3",
        dots: true,
        glyphs: { call: "*", read: "->", write: "*", search: "*", status: "~", done: "\u2713" }
      },
      "claude-code": {
        prefix: "claude",
        agentGlyph: "\u23FA",
        dots: false,
        glyphs: { call: "\u23FA", read: "\u23FA", write: "\u23FA", search: "\u23FA", status: "\u273B", done: "\u2714" }
      },
      codex: {
        prefix: "codex",
        agentGlyph: "\u258C",
        dots: false,
        glyphs: { call: "\u2022", read: "\u203A", write: "\u2022", search: "\u2022", status: "\u2026", done: "\u2713" }
      },
      shell: {
        prefix: "$",
        dots: true,
        userGlyph: "$",
        glyphs: { call: "$", read: "$", write: "$", search: "$", status: "~", done: "\u2713" }
      }
    };

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function md(s) {
      var out = esc(s);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return out;
    }

    function renderDiffLine(l) {
      var d = document.createElement("div");
      d.className = "diff-line " + (l.type || "ctx");
      if (l && typeof l === "object" && (l.left !== undefined || l.right !== undefined)) {
        d.className += " cols";
        var left = document.createElement("span");
        left.className = "dl-left";
        left.innerHTML = md(l.left || "");
        var right = document.createElement("span");
        right.className = "dl-right";
        right.innerHTML = md(l.right || "");
        d.appendChild(left);
        d.appendChild(right);
      } else {
        d.innerHTML = md(l.text);
      }
      return d;
    }

    function renderBlock(b, T) {
      var el;
      if (b.type === "user") {
        el = document.createElement("div");
        el.className = "user-msg";
        el.innerHTML = '<span class="user-glyph">' + esc(T.userGlyph || ">") + '</span>' +
          '<span class="user-text">' + md(b.text) + "</span>";
      } else if (b.type === "prose") {
        el = document.createElement("p");
        el.className = "prose-line";
        el.innerHTML = md(b.text);
      } else if (b.type === "tool") {
        var kind = b.kind || "call";
        var glyph = (T.glyphs && T.glyphs[kind]) || T.glyphs.call;
        el = document.createElement("div");
        el.className = "tool-line tool-" + kind;
        el.innerHTML = '<span class="tool-glyph">' + esc(glyph) + '</span>' +
          '<span class="tool-text">' + md(b.text) + "</span>";
      } else if (b.type === "diff") {
        el = document.createElement("div");
        el.className = "diff";
        (b.lines || []).forEach(function (l) { el.appendChild(renderDiffLine(l)); });
      } else if (b.type === "file") {
        el = document.createElement("div");
        el.className = "file";
        var pathEl = document.createElement("div");
        pathEl.className = "file-path";
        pathEl.textContent = b.path || "";
        el.appendChild(pathEl);
        (b.lines || []).forEach(function (l) { el.appendChild(renderDiffLine(l)); });
      } else if (b.type === "status") {
        el = document.createElement("div");
        el.className = "status";
        el.innerHTML = '<span class="status-glyph">' + esc(T.glyphs.status) + '</span>' +
          '<span class="status-text">' + md(b.text) + "</span>";
      } else if (b.type === "done") {
        el = document.createElement("div");
        el.className = "done";
        el.innerHTML = '<span class="done-glyph">' + esc(T.glyphs.done) + '</span>' +
          '<span class="done-text">' + md(b.text) + "</span>";
      } else if (b.type === "steps") {
        el = document.createElement("div");
        el.className = "steps";
        var steps = Array.isArray(b.steps) ? b.steps : [];
        steps.slice(0, 8).forEach(function (s, i) {
          var state = s && s.state ? s.state : "ok";
          var row = document.createElement("div");
          row.className = "step" + (state === "removed" ? " removed" : "");
          var num = document.createElement("span");
          num.className = "step-num";
          num.textContent = String(i + 1);
          var glyph = document.createElement("span");
          glyph.className = "step-glyph " + state;
          glyph.textContent = state === "pain" ? "\u2717" : state === "removed" ? "\u2013" : "\u2713";
          var text = document.createElement("span");
          text.className = "step-text";
          text.innerHTML = md(s ? s.text : "");
          row.appendChild(num);
          row.appendChild(glyph);
          row.appendChild(text);
          el.appendChild(row);
        });
        if (steps.length > 8) {
          var more = document.createElement("div");
          more.className = "steps-more";
          more.textContent = "... +" + (steps.length - 8) + " more steps";
          el.appendChild(more);
        }
      } else {
        el = document.createElement("p");
        el.className = "prose-line";
        el.innerHTML = md(b.text || "");
      }
      return el;
    }

    window.fillTemplate = function (data) {
      var theme = data.theme || "opencode";
      var T = THEMES[theme] || THEMES.opencode;
      document.body.setAttribute("data-theme", theme);
      document.body.setAttribute("data-palette", data.palette === "light" ? "light" : "dark");

      function resolve(el, key) {
        var panel = el.closest("[data-panel]");
        var pk = panel ? panel.getAttribute("data-panel") : null;
        if (pk && data[pk] && key in data[pk]) return data[pk][key];
        if (key in data) return data[key];
        return undefined;
      }

      function surfaceFor(pk) {
        if (pk && data[pk] && data[pk].surface) return data[pk].surface;
        if (data.surface) return data.surface;
        return "terminal";
      }

      function panelValue(pk, key) {
        if (pk && data[pk] && key in data[pk]) return data[pk][key];
        if (key in data) return data[key];
        return undefined;
      }

      document.querySelectorAll("[data-panel]").forEach(function (panel) {
        var pk = panel.getAttribute("data-panel");
        panel.setAttribute("data-surface", surfaceFor(pk));
        var win = panel.querySelector(".window");
        if (win && surfaceFor(pk) === "shots") win.classList.add("shot");
      });

      document.querySelectorAll(".win-prefix").forEach(function (el) {
        var panel = el.closest("[data-panel]");
        var pk = panel ? panel.getAttribute("data-panel") : null;
        el.textContent = surfaceFor(pk) === "files" ? "\u25A4" : T.prefix;
      });

      document.querySelectorAll(".dots").forEach(function (el) {
        var panel = el.closest("[data-panel]");
        var pk = panel ? panel.getAttribute("data-panel") : null;
        el.style.display = (T.dots && surfaceFor(pk) !== "files") ? "flex" : "none";
      });

      document.querySelectorAll("[data-slot]").forEach(function (el) {
        var value = resolve(el, el.getAttribute("data-slot"));
        if (value !== undefined && value !== null) el.textContent = value;
      });

      document.querySelectorAll("[data-blocks]").forEach(function (container) {
        var panel = container.closest("[data-panel]");
        var pk = panel ? panel.getAttribute("data-panel") : null;
        container.innerHTML = "";
        if (surfaceFor(pk) === "shots") {
          var shot = panelValue(pk, "shot");
          if (shot) {
            var canvas = document.createElement("div");
            canvas.className = "shot-canvas";
            var shotW = panelValue(pk, "shotW");
            var shotScale = panelValue(pk, "shotScale") || 2;
            if (shotW) canvas.style.setProperty("--shot-w", (shotW / shotScale) + "px");
            var img = document.createElement("img");
            img.src = shot;
            img.alt = "";
            canvas.appendChild(img);
            var annos = panelValue(pk, "annotations");
            (Array.isArray(annos) ? annos : []).forEach(function (a) {
              if (!a || typeof a !== "object") return;
              var rect = document.createElement("div");
              rect.className = "shot-anno" + (a.color === "green" ? " green" : "") + (a.dim ? " dim" : "");
              rect.style.left = "calc(" + a.x + " * 100%)";
              rect.style.top = "calc(" + a.y + " * 100%)";
              rect.style.width = "calc(" + a.w + " * 100%)";
              rect.style.height = "calc(" + a.h + " * 100%)";
              if (a.label) {
                var label = document.createElement("span");
                label.className = "shot-anno-label";
                label.textContent = a.label;
                rect.appendChild(label);
              }
              canvas.appendChild(rect);
            });
            container.appendChild(canvas);
          }
          var shotCaption = panelValue(pk, "shotCaption");
          if (shotCaption) {
            var cap = document.createElement("div");
            cap.className = "shot-caption";
            cap.textContent = shotCaption;
            container.appendChild(cap);
          }
          return;
        }
        var blocks = (pk && data[pk] && data[pk].blocks) || [];
        blocks.forEach(function (b) { container.appendChild(renderBlock(b, T)); });
        var collapses = panelValue(pk, "collapses");
        if (typeof collapses === "number" && collapses > 0) {
          var line = document.createElement("div");
          line.className = "steps-collapse";
          line.innerHTML = '<span class="steps-collapse-glyph">\u21B3</span> collapses ' + collapses + ' steps';
          container.appendChild(line);
        }
      });

      var takeaway = document.querySelector(".takeaway");
      if (takeaway) {
        var hasTakeaway = data.takeaway !== undefined && data.takeaway !== null && String(data.takeaway).trim() !== "";
        takeaway.style.display = hasTakeaway ? "flex" : "none";
      }
    };
  </script>
</body>
</html>
