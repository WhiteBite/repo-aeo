<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero banner template</title>
<style>
  :root {
    --bg: #121827;
    --fg: #F7F2E8;
    --muted: #8F9AAF;
    --accent1: #FF7458;
    --accent2: #63D3BE;
    --accent3: #6A62D9;
    --card: #232D42;
    --line: #3E4B66;
    --warn: #E9A03C;
    --danger: #E2563E;
    --card-strong: #1F2A45;
    --card-shadow: 5px 6px 0 rgba(0, 0, 0, 0.28);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  body[data-palette="light"] {
    --bg: #F5F1E9;
    --fg: #172033;
    --muted: #747B86;
    --card: #FDFCF8;
    --line: #CFC7B6;
    --warn: #B26A12;
    --danger: #C0392B;
    --card-strong: #FFF1EA;
    --card-shadow: 5px 6px 0 rgba(23, 32, 51, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .stage {
    width: 900px;
    padding: 48px;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 58fr 42fr;
    column-gap: 40px;
    align-items: start;
  }
  .hero-grid.no-cards { grid-template-columns: 1fr; }

  .hero-eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hero-eyebrow::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--accent1);
    margin-right: 12px;
    vertical-align: 1px;
  }

  .hero-title {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1.05;
    color: var(--fg);
    white-space: pre-line;
    margin-top: 22px;
  }
  .hero-title em { font-style: normal; color: var(--danger); }

.hero-subtitle {
    font-size: 20px;
    line-height: 1.45;
    color: var(--muted);
    margin-top: 22px;
    text-wrap: balance;
    white-space: pre-line;
  }

  .hero-meta {
    font-size: 16px;
    letter-spacing: 0.02em;
    color: var(--fg);
    opacity: 0.85;
    margin-top: 32px;
  }

  .hero-cards {
    display: flex;
    flex-direction: column;
  }

  .hero-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--card-shadow);
  }
  .hero-card + .hero-card { margin-top: 18px; }
  .hero-card[data-tone="accent2"] { --tone: var(--accent2); }
  .hero-card[data-tone="accent3"] { --tone: var(--accent3); }

  .hero-card-heading {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hero-card-heading::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 3px;
    background: var(--tone, var(--accent1));
    flex: 0 0 auto;
  }

  .hero-card-body {
    font-size: 17px;
    line-height: 1.45;
    color: var(--muted);
    margin-top: 10px;
    text-wrap: balance;
  }

  body[data-mode="copy-only"] .hero-cards { display: none; }
  body[data-mode="copy-only"] .hero-grid { grid-template-columns: 1fr; }
  body[data-mode="copy-only"] .hero-copy { text-align: center; max-width: 720px; margin: 0 auto; }
  body[data-mode="copy-only"] .hero-meta { margin-top: 22px; }

  body[data-mode="strip"] .hero-grid { grid-template-columns: 1fr; }
  body[data-mode="strip"] .hero-cards { flex-direction: row; align-items: stretch; gap: 18px; }
  body[data-mode="strip"] .hero-card { flex: 1 1 0; min-width: 0; }
  body[data-mode="strip"] .hero-card + .hero-card { margin-top: 0; }
  body[data-mode="strip"] .hero-copy { margin-bottom: 32px; }

  body[data-mode="wall"] .hero-grid { grid-template-columns: 1fr; }
  body[data-mode="wall"] .hero-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  body[data-mode="wall"] .hero-card:last-child:nth-child(odd) { grid-column: span 2; }
  body[data-mode="wall"] .hero-card + .hero-card { margin-top: 0; }
  body[data-mode="wall"] .hero-copy { margin-bottom: 32px; }

.hero-rail { display: none; margin-top: 30px; }
  body[data-mode="rail"] .hero-grid { grid-template-columns: 1fr; }
  body[data-mode="rail"] .hero-cards { display: none; }
  body[data-mode="rail"] .hero-rail { display: block; }
  body[data-mode="rail"] .hero-copy { position: relative; }
  body[data-mode="rail"] .hero-meta {
    position: absolute;
    top: 0;
    right: 0;
    margin-top: 0;
    font-family: var(--mono);
    font-size: 13px;
    text-align: right;
  }
  .hero-rail-step[data-state="gate"] .hero-rail-label { padding-left: 14px; }

  .hero-rail-steps { display: grid; column-gap: 28px; }
  .hero-rail[data-steps="3"] .hero-rail-steps { grid-template-columns: 170px 170px 1fr; }
  .hero-rail[data-steps="2"] .hero-rail-steps { grid-template-columns: 190px 1fr; }

  .hero-rail-step { position: relative; padding-top: 28px; }
  .hero-rail-step::before {
    content: "";
    position: absolute;
    top: 0;
    left: -2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--line);
  }
  .hero-rail-step:not(:last-child)::after {
    content: "";
    position: absolute;
    top: 5px;
    left: 10px;
    width: calc(100% + 22px);
    height: 2px;
    background: var(--line);
  }
  .hero-rail-step[data-state="warn"]::before { background: var(--warn); }
  .hero-rail-step[data-state="warn"]:not(:last-child)::after { background: var(--warn); }
  .hero-rail-step[data-state="gate"]::before { background: var(--danger); }
  .hero-rail-step[data-state="gate"]::after {
    content: "";
    position: absolute;
    top: 12px;
    left: 0;
    width: 4px;
    height: calc(100% - 12px);
    background: var(--danger);
    z-index: 0;
  }

  .hero-rail-label {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hero-rail-step[data-state="warn"] .hero-rail-label { color: var(--warn); }
  .hero-rail-step[data-state="gate"] .hero-rail-label { color: var(--danger); }

  .hero-rail-count {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--mono);
    font-size: 48px;
    font-weight: 600;
    line-height: 1;
    color: var(--fg);
    margin-top: 6px;
  }
  .hero-rail-unit {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .hero-rail-note {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }
  .hero-rail-step[data-state="warn"] .hero-rail-note { color: var(--warn); }

  .hero-gate {
    position: relative;
    z-index: 1;
    margin-top: 8px;
    border-radius: 0 8px 8px 0;
    overflow: hidden;
    box-shadow: var(--card-shadow);
  }
.hero-gate-part {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.45;
    padding: 11px 13px;
    background: var(--card);
    color: var(--muted);
    border-left: 4px solid var(--danger);
  }
  .hero-gate-part + .hero-gate-part { border-top: 1px solid var(--line); }
  .hero-gate-part b {
    display: block;
    color: var(--warn);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }
  .hero-gate-part[data-state="block"] { background: var(--card-strong); color: var(--fg); }
  .hero-gate-part[data-state="block"] b { color: var(--danger); }
</style>
</head>
<body data-mode="split">
  <div class="stage">
    <div class="hero-grid">
      <div class="hero-copy">
        <div class="hero-eyebrow" data-hero="eyebrow">Repo discoverability kit</div>
        <h1 class="hero-title" data-hero="title">Project title</h1>
        <p class="hero-subtitle" data-hero="subtitle">One sentence that says what the project does.</p>
        <div class="hero-meta" data-hero="meta">npm · cli</div>
      </div>
      <div class="hero-cards" data-hero-cards>
        <div class="hero-card" data-tone="accent1">
          <div class="hero-card-heading">Card</div>
          <div class="hero-card-body">One true, checkable fact from the repository.</div>
        </div>
      </div>
    </div>
    <div class="hero-rail" data-hero-rail hidden>
      <div class="hero-rail-steps" data-hero-steps></div>
    </div>
  </div>

  <script>
    window.fillTemplate = function (data) {
      data = data || {};
      document.body.setAttribute("data-palette", data.palette === "light" ? "light" : "dark");
      var mode = typeof data.mode === "string" && data.mode !== "" ? data.mode : "split";
      document.body.setAttribute("data-mode", mode);

      if (typeof data.accent === "string" && /^#[0-9a-fA-F]{6}$/.test(data.accent)) {
        document.documentElement.style.setProperty("--accent1", data.accent);
      }

      function fill(name, value) {
        var el = document.querySelector('[data-hero="' + name + '"]');
        if (!el) return;
        if (typeof value === "string" && value.trim() !== "") {
          el.textContent = value;
          el.style.display = "";
        } else {
          el.style.display = "none";
        }
      }

fill("eyebrow", data.eyebrow);
      fill("title", data.title);
      fill("subtitle", data.subtitle);
      fill("meta", data.meta);

      var titleEl = document.querySelector('[data-hero="title"]');
      var accentWord = typeof data.accentWord === "string" ? data.accentWord : "";
      if (titleEl && accentWord && typeof data.title === "string" && data.title.indexOf(accentWord) !== -1) {
        var at = data.title.indexOf(accentWord);
        var em = document.createElement("em");
        em.textContent = accentWord;
        titleEl.replaceChildren(
          document.createTextNode(data.title.slice(0, at)),
          em,
          document.createTextNode(data.title.slice(at + accentWord.length))
        );
      }

      var stack = document.querySelector("[data-hero-cards]");
      var grid = document.querySelector(".hero-grid");
      var cards = Array.isArray(data.cards) ? data.cards.slice(0, 4) : [];
      if (stack) {
        stack.replaceChildren();
        cards.forEach(function (entry) {
          if (!entry || typeof entry !== "object") return;
          var card = document.createElement("div");
          card.className = "hero-card";
          card.setAttribute("data-tone", entry.tone === "accent2" || entry.tone === "accent3" ? entry.tone : "accent1");
          var rotate = Number(entry.rotate);
          if (mode === "split" && Number.isFinite(rotate) && rotate !== 0) {
            card.style.transform = "rotate(" + Math.max(-6, Math.min(6, rotate)) + "deg)";
          }
          var heading = document.createElement("div");
          heading.className = "hero-card-heading";
          heading.textContent = typeof entry.heading === "string" ? entry.heading : "";
          var body = document.createElement("div");
          body.className = "hero-card-body";
          body.textContent = typeof entry.body === "string" ? entry.body : "";
          card.appendChild(heading);
          card.appendChild(body);
          stack.appendChild(card);
        });
        stack.style.display = cards.length > 0 ? "" : "none";
      }
      if (grid) grid.classList.toggle("no-cards", cards.length === 0);

      var rail = document.querySelector("[data-hero-rail]");
      var stepsData = Array.isArray(data.steps) ? data.steps.slice(0, 3) : [];
      var artifacts = Array.isArray(data.artifact) ? data.artifact.slice(0, 2) : [];
      var useRail = mode === "rail" && stepsData.length >= 2 && artifacts.length >= 1;
      if (mode === "rail" && !useRail) document.body.setAttribute("data-mode", "split");
      if (rail) {
        var stepsHost = rail.querySelector("[data-hero-steps]");
        stepsHost.replaceChildren();
        rail.hidden = !useRail;
        if (useRail) {
          rail.setAttribute("data-steps", String(stepsData.length));
          stepsData.forEach(function (entry, index) {
            var last = index === stepsData.length - 1;
            var step = document.createElement("div");
            step.className = "hero-rail-step";
            step.setAttribute("data-state", last ? "gate" : index === 0 ? "muted" : "warn");
            var label = document.createElement("div");
            label.className = "hero-rail-label";
            label.textContent = entry && typeof entry.label === "string" ? entry.label : "";
            step.appendChild(label);
            if (!last && entry && typeof entry.count === "string" && entry.count !== "") {
              var count = document.createElement("div");
              count.className = "hero-rail-count";
              count.appendChild(document.createTextNode(entry.count));
              if (typeof entry.unit === "string" && entry.unit !== "") {
                var unit = document.createElement("span");
                unit.className = "hero-rail-unit";
                unit.textContent = entry.unit;
                count.appendChild(unit);
              }
              step.appendChild(count);
              if (typeof entry.note === "string" && entry.note !== "") {
                var note = document.createElement("div");
                note.className = "hero-rail-note";
                note.textContent = entry.note;
                step.appendChild(note);
              }
            }
            if (last) {
              var gate = document.createElement("div");
              gate.className = "hero-gate";
              artifacts.forEach(function (item, i) {
                var part = document.createElement("div");
                part.className = "hero-gate-part";
                if (i === 1) part.setAttribute("data-state", "block");
                var title = document.createElement("b");
                title.textContent = item && typeof item.title === "string" ? item.title : "";
                part.appendChild(title);
                var lines = item && Array.isArray(item.lines) ? item.lines.slice(0, 2) : [];
                lines.forEach(function (line) {
                  var row = document.createElement("div");
                  row.textContent = typeof line === "string" ? line : "";
                  part.appendChild(row);
                });
                gate.appendChild(part);
              });
              step.appendChild(gate);
            }
            stepsHost.appendChild(step);
          });
        }
      }
    };
  </script>
</body>
</html>
