name: 'rdk-discoverability'
description: >-
  Run a Repo Discoverability Kit audit, publish a PR comment with the
  Discoverability Score and findings, and optionally open an autofix pull
  request when the project opted in via safety.allow_autofix.

inputs:
  min_score:
    description: 'Fail the run when the Discoverability Score is below this value'
    required: false
    default: '0'
  online:
    description: 'Probe outbound links and read live GitHub metadata'
    required: false
    default: 'true'
  cli:
    description: 'Command used to invoke the CLI (e.g. npx --yes repo-aeo@^0.3.0, or node path/to/bin/rdk.js for an in-repo copy)'
    required: false
    default: 'npx --yes repo-aeo@^0.3.0'
  comment:
    description: 'Publish/update a PR comment with the report'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run the audit (PR comment)
      shell: bash
      run: node "${{ github.action_path }}/run-audit.mjs" ${{ inputs.cli }} audit --format github-comment ${{ inputs.online == 'true' && '--online' || '' }} --out rdk-comment.md

    - name: Run the audit (min-score gate)
      shell: bash
      run: node "${{ github.action_path }}/run-audit.mjs" ${{ inputs.cli }} audit --format json ${{ inputs.online == 'true' && '--online' || '' }} --out rdk-report.json --min-score "${{ inputs.min_score }}"

    - name: Publish the PR comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- rdk-discoverability-audit -->';
          if (!fs.existsSync('rdk-comment.md')) {
            core.warning('rdk-comment.md was not produced');
            return;
          }
          let body = fs.readFileSync('rdk-comment.md', 'utf8');
          if (!body.includes(marker)) body = `${marker}\n${body}`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
          }
